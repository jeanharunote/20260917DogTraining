# ---------------------------------------------------------------------------
# Netlify 배포 설정
#
# 이 프로젝트는 AI 코치 기능(/api/coach)이 서버에서 동작해야 하므로,
# Next.js 전용 런타임 플러그인이 반드시 필요합니다.
# 이 파일이 있으면 Netlify 가 플러그인을 자동으로 설치해 줍니다.
# ---------------------------------------------------------------------------
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
