# ---------------------------------------------------------------------------
# Netlify 배포 설정
#
# 이 사이트는 정적 사이트(next.config.ts 의 output: "export")라서
# 빌드하면 out/ 폴더에 완성된 HTML 이 만들어지고, 그 폴더를 그대로 올립니다.
# (Cloudflare Pages 도 같은 방식: 빌드 명령 npm run build, 출력 폴더 out)
# ---------------------------------------------------------------------------
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
